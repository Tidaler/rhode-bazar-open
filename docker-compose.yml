# Deploiement multi-poste optionnel : backend Spring Boot + MySQL en conteneurs.
# Usage : docker compose up -d
# Le client JavaFX (poste utilisateur) se connecte ensuite au backend via son IP locale, port 8085.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rhodebazar
      MYSQL_USER: rhodebazar
      MYSQL_PASSWORD: ${RHODEBAZAR_DB_PASSWORD:-rhodebazar}
      MYSQL_ROOT_PASSWORD: ${RHODEBAZAR_DB_ROOT_PASSWORD:-changez-moi}
    volumes:
      - rhodebazar-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      RHODEBAZAR_DB_HOST: mysql
      RHODEBAZAR_DB_PORT: 3306
      RHODEBAZAR_DB_NAME: rhodebazar
      RHODEBAZAR_DB_USER: rhodebazar
      RHODEBAZAR_DB_PASSWORD: ${RHODEBAZAR_DB_PASSWORD:-rhodebazar}
      RHODEBAZAR_JWT_SECRET: ${RHODEBAZAR_JWT_SECRET:?definir un secret JWT dans .env}
      RHODEBAZAR_ADMIN_PASSWORD: ${RHODEBAZAR_ADMIN_PASSWORD:?definir le mot de passe admin initial dans .env}
    ports:
      - "8085:8085"

volumes:
  rhodebazar-mysql-data:
